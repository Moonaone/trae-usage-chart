name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: syntax + unit + render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # These three scripts are plain Node and platform-neutral on purpose:
      # only pack.ps1 / verify.ps1 are Windows-specific.
      - name: Syntax check (every .js parses)
        run: node build/check-syntax.js

      - name: Unit tests (pure modules + store)
        run: node build/selftest.js

      - name: Render smoke test (dashboard against a DOM stub)
        run: node build/render-smoke.js
